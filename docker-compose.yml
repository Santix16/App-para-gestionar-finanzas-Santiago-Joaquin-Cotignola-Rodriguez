services:
  db:
    image: postgres:16
    container_name: finanzas-db
    environment:
      POSTGRES_USER: finanzas
      POSTGRES_PASSWORD: finanzas
      POSTGRES_DB: finanzas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finanzas -d finanzas"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    profiles: ["full"]
    build: ./backend
    container_name: finanzas-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://finanzas:finanzas@db:5432/finanzas
      JWT_SECRET: ${JWT_SECRET:-}
      PORT: "3000"
      CORS_ORIGIN: http://localhost:8080
      COOKIE_SAMESITE: lax
      COOKIE_SECURE: "false" # prueba local con HTTP; en producción usa HTTPS y quítalo
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    profiles: ["full"]
    build: ./frontend
    container_name: finanzas-web
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata: