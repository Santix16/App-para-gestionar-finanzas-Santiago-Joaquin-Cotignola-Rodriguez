name: Android APK

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"
          accept-android-sdk-licenses: true

      - name: Instalar dependencias
        run: npm ci || npm install --no-audit --no-fund

      - name: Activar modo local y empaquetar las fuentes
        run: |
          npm install --no-save --no-audit --no-fund @fontsource/roboto@5 material-icons@1
          node scripts/prepare-local.mjs
          cat src/app/core/app-mode.ts

      - name: Compilar Angular
        run: npx ng build --configuration production

      - name: Generar y sincronizar el proyecto Android
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar el APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Guardar el APK
        uses: actions/upload-artifact@v4
        with:
          name: finanzas-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Adjuntar el APK a la release (solo con etiqueta)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: frontend/android/app/build/outputs/apk/debug/app-debug.apk