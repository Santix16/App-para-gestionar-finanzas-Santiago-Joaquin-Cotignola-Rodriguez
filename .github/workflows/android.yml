name: Android APK

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write 

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar la URL de la API
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::error::Falta la variable de repositorio API_URL (Settings > Secrets and variables > Actions > Variables). Ejemplo: https://mi-api.onrender.com/api"
            exit 1
          fi
          case "$API_URL" in
            https://*) ;;
            *) echo "::error::API_URL debe empezar por https://"; exit 1 ;;
          esac

      - name: Escribir la URL de la API en el frontend
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          node -e "require('fs').writeFileSync('src/app/core/api.config.ts', 'export const API_URL = ' + JSON.stringify(process.env.API_URL) + ';\n')"
          cat src/app/core/api.config.ts

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'
          accept-android-sdk-licenses: true

      - run: npm ci

      - name: Compilar Angular
        run: npx ng build --configuration production

      - name: Generar y sincronizar el proyecto Android
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar el APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Guardar el APK
        uses: actions/upload-artifact@v4
        with:
          name: finanzas-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Adjuntar el APK a la release (solo con etiqueta)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: frontend/android/app/build/outputs/apk/debug/app-debug.apk